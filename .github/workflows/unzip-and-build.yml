name: DuoM Android Build

on:
  push:
    branches: [main, master]
    paths:
      - 'trinitymax_android.zip'
      - '.github/workflows/unzip-and-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Extract source and build DuoM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP into repository workspace
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="trinitymax_android.zip"
          test -f "$ZIP_FILE" || { echo "::error::trinitymax_android.zip is missing"; exit 1; }
          mkdir -p _duom_source
          unzip -q "$ZIP_FILE" -d _duom_source

          CARGO_FILE="$(find _duom_source -type f -name Cargo.toml -print -quit)"
          test -n "$CARGO_FILE" || { echo "::error::Cargo.toml was not found inside the ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$CARGO_FILE")"

          # Copy all project files, including hidden files, into the workspace.
          cp -a "$PROJECT_DIR"/. .
          test -f Cargo.toml
          test -d src
          test -d android

      - name: Patch known Bedrock MOTD format string
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/lib.rs")
          if p.exists():
              s = p.read_text()
              old = '"MCPE;{};766;1.21.50;{};{};{};{};1;{};{};",'
              new = '"MCPE;{};766;1.21.50;{};{};{};{};1;{};{};{};",'
              if old in s:
                  p.write_text(s.replace(old, new, 1))
                  print("Applied Bedrock MOTD placeholder fix.")
              else:
                  print("MOTD line did not match known old version; leaving source unchanged.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure Android NDK linkers
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK_BIN/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_BIN/armv7a-linux-androideabi21-clang"

          [target.i686-linux-android]
          linker = "$NDK_BIN/i686-linux-android21-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_BIN/x86_64-linux-android21-clang"
          EOF

      - name: Build Rust libraries for Android
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            cargo build --release --lib --target "$target"
          done

      - name: Build standalone server
        run: cargo build --release --bin trinitymax_server

      - name: Copy native libraries into Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp target/aarch64-linux-android/release/libtrinitymax.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtrinitymax.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/i686-linux-android/release/libtrinitymax.so android/app/src/main/jniLibs/x86/
          cp target/x86_64-linux-android/release/libtrinitymax.so android/app/src/main/jniLibs/x86_64/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -exec cp {} dist/ \;
          cp target/release/trinitymax_server dist/
          cp server.properties dist/ 2>/dev/null || true
          cp whitelist.json dist/ 2>/dev/null || true
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload DuoM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoM-Android-APKs-and-server
          path: dist/*
          if-no-files-found: error
          retention-days: 30
