name: build-trinitymax-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip & patch project archive
        id: unzip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "trinitymax_android.zip" -o -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p _unzipped
            unzip -qo "$ZIP_FILE" -d _unzipped
            PROJ_DIR=$(find _unzipped -maxdepth 3 -name "Cargo.toml" -printf '%h\n' | head -n 1)
            if [ -n "$PROJ_DIR" ]; then
              cp -rf "$PROJ_DIR"/* .
            fi
          fi
          if [ -f "src/lib.rs" ]; then
            sed -i 's/socket\.recv_from(&mut buf);/socket.recv_from(\&mut buf).await?;/' src/lib.rs
            echo "--- patched src/lib.rs (lines 110-120) ---"
            sed -n '110,120p' src/lib.rs
          fi
          ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Configure NDK linkers for cargo
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK_BIN/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_BIN/armv7a-linux-androideabi21-clang"

          [target.i686-linux-android]
          linker = "$NDK_BIN/i686-linux-android21-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_BIN/x86_64-linux-android21-clang"
          EOF

      - name: Build Rust native libraries (4 Android ABIs)
        run: |
          set -e
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            echo "=== building libtrinitymax.so for $t ==="
            cargo build --release --lib --target "$t"
          done

      - name: Build standalone server binary (host target)
        run: |
          cargo build --release --bin trinitymax_server

      - name: Stage native libraries into Android jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64

          cp target/aarch64-linux-android/release/libtrinitymax.so   android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtrinitymax.so android/app/src/main/jniLibs/armeabi-
