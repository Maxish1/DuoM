name: build-trinitymax-apk

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'server.properties'
      - 'whitelist.json'
      - 'plugins/**'
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trinitymax-android-ndk

      - name: Configure NDK linkers for cargo
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK_BIN/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_BIN/armv7a-linux-androideabi21-clang"

          [target.i686-linux-android]
          linker = "$NDK_BIN/i686-linux-android21-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_BIN/x86_64-linux-android21-clang"
          EOF

      - name: Build Rust native libraries (4 Android ABIs)
        run: |
          set -e
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            echo "=== building libtrinitymax.so for $t ==="
            cargo build --release --lib --target "$t"
          done

      - name: Build standalone server binary (host target)
        run: |
          cargo build --release --bin trinitymax_server

      - name: Stage native libraries into Android jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64

          cp target/aarch64-linux-android/release/libtrinitymax.so   android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtrinitymax.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/i686-linux-android/release/libtrinitymax.so      android/app/src/main/jniLibs/x86/
          cp target/x86_64-linux-android/release/libtrinitymax.so    android/app/src/main/jniLibs/x86_64/

          echo "--- staged .so files ---"
          find android/app/src/main/jniLibs -type f | sort

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APKs with Gradle
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p dist

          for apk in android/app/build/outputs/apk/debug/*.apk; do
            basename_apk=$(basename "$apk")
            newname=$(echo "$basename_apk" | sed 's/app-/trinitymax_/' | sed 's/-debug//')
            cp "$apk" "dist/$newname"
          done

          cp target/release/trinitymax_server dist/trinitymax_server
          chmod +x dist/trinitymax_server

          echo "--- final artifacts ---"
          ls -lh dist/

      - name: Upload APK + server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trinitymax-apks
          path: |
            dist/trinitymax_*.apk
            dist/trinitymax_server
            server.properties
            whitelist.json
            AI_PROMPT_STATE.md
          if-no-files-found: error
          retention-days: 30
